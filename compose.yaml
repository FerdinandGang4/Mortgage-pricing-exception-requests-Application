services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pricing_exceptions
      POSTGRES_USER: pricing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricing -d pricing_exceptions"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__PricingExceptions: Host=postgres;Port=5432;Database=pricing_exceptions;Username=pricing;Password=${POSTGRES_PASSWORD:-local-demo-password}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5267}:8080"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: FrontEnd/Dockerfile
      args:
        VITE_ENABLE_DEMO_USERS: "true"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
