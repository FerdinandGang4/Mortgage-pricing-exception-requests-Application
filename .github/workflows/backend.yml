name: Backend validation

on:
  push:
    paths:
      - 'Backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'Backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/BlueHarvest.PricingExceptions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore BlueHarvest.PricingExceptions.slnx
      - run: dotnet build BlueHarvest.PricingExceptions.slnx --configuration Release --no-restore
      - run: dotnet test BlueHarvest.PricingExceptions.slnx --configuration Release --no-build --no-restore --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: Backend/BlueHarvest.PricingExceptions/TestResults/*.trx
